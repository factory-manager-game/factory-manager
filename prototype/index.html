<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Factory Manager — a browser game about running an electronics factory and learning industrial engineering by playing.">
  <title>Factory Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <section class="kpis" id="kpis" aria-label="KPIs"></section>
    <main class="grid" id="main"></main>
    <footer class="foot">Factory Manager · v0.1 MVP</footer>
  </div>
  <div id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- configuration and helpers -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/i18n.js"></script>
  <!-- simulation engine (no DOM) -->
  <script src="js/engine/state.js"></script>
  <script src="js/engine/production.js"></script>
  <script src="js/engine/market.js"></script>
  <script src="js/engine/finance.js"></script>
  <script src="js/engine/actions.js"></script>
  <script src="js/engine/engine.js"></script>
  <!-- user interface -->
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/charts.js"></script>
  <script src="js/ui/render.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
